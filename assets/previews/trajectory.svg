3] </text><text x="800.67" y="520.60" font-family="serif" font-size="13.00" fill="#171717" text-anchor="start" xml:space="preserve">The final state preserves the disclosure.</text><path d="M 790.67,138.12 L 790.67,537.76" fill="none" stroke="#171717" stroke-width="0.8"/></g><path d="M 28.00,485.44 L 1172.00,485.44" fill="none" stroke="#171717" stroke-width="0.8"/><text x="20" y="575" font-family="sans-serif" font-size="10" fill="#575757">ILLUSTRATIVE TRACE — schematic interfaces and example events, not recorded evidence</text></svg>