761" text-anchor="start" xml:space="preserve">ILLUSTRATIVE UI  /  Review workspace</text><rect x="38.00" y="266.41" width="42.16" height="209.03" rx="0" fill="#EFF1F4" stroke="none" /><rect x="48.04" y="283.47" width="21.08" height="5.02" rx="1" fill="#BBC5D1" stroke="none" /><rect x="48.04" y="307.56" width="21.08" height="5.02" rx="1" fill="#BBC5D1" stroke="none" /><rect x="48.04" y="331.65" width="21.08" height="5.02" rx="1" fill="#BBC5D1" stroke="none" /><rect x="48.04" y="355.74" width="21.08" height="5.02" rx="1" fill="#BBC5D1" stroke="none" /><rect x="48.04" y="379.83" width="21.08" height="5.02" rx="1" fill="#BBC5D1" stroke="none" /><text x="91.20" y="293.51" font-family="sans-serif" font-size="13.05" fill="#171717" text-anchor="start" xml:space="preserve">Release change set</text><path d="M 91.20,306.72 L 387.29,306.72" fill="none" stroke="#CCD1D8" stroke-width="1"/><text x="91.20" y="324.78" font-family="sans-serif" font-size="9.03" fill="#58616E" text-anchor="start" xml:space="preserve">Overview    Activity    Changes</text><rect x="91.20" y="338.84" width="295.09" height="23.09" rx="1" fill="#FAFBFC" stroke="#D7DCE2" /><text x="98.22" y="351.88" font-family="sans-serif" font-size="10.04" fill="#171717" text-anchor="start" xml:space="preserve">Ready for review.</text><rect x="91.20" y="368.95" width="295.09" height="23.09" rx="1" fill="#FAFBFC" stroke="#D7DCE2" /><text x="98.22" y="382.00" font-family="sans-serif" font-size="10.04" fill="#171717" text-anchor="start" xml:space="preserve"><tspan x="98.22" xml:space="preserve" fill="#BA2C29">Internal budget: 42 units.</tspan></text><rect x="91.20" y="451.35" width="78.29" height="16.06" rx="1" fill="#3478B8" stroke="none" /><text x="130.34" y="463.39" font-family="sans-serif" font-size="8.03" fill="white" text-anchor="middle" xml:space="preserve">Save draft</text><rect x="88.59" y="367.04" width="296.29" height="26.81" rx="0" fill="none" stroke="#BA2C29" stroke-width="1.5" data-role="callout" data-step="t1"/